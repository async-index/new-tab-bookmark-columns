<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="columns-container"></div>

  <button id="settings-toggle" title="Settings">

    </svg>
  </button>

  <div id="settings-panel" class="hidden">
    <div class="settings-header">
      <h2>Settings</h2>
      <button id="settings-close" title="Close settings">
        <svg width="19" height="15" viewBox="0 0 19 15" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10.8594 13.1055H12.2266V1.18164H10.8594V13.1055ZM3.36914 14.248H14.9805C16.9824 14.248 18.1152 13.0371 18.1152 10.8691V3.38867C18.1152 1.2207 16.9824 0.00976562 14.9805 0.00976562H3.36914C1.21094 0.00976562 0 1.2207 0 3.38867V10.8691C0 13.0371 1.21094 14.248 3.36914 14.248ZM3.36914 12.832C2.11914 12.832 1.40625 12.1289 1.40625 10.8691V3.38867C1.40625 2.12891 2.11914 1.42578 3.36914 1.42578H14.7461C16.0059 1.42578 16.709 2.12891 16.709 3.38867V10.8691C16.709 12.1289 16.0059 12.832 14.7461 12.832H3.36914ZM13.7012 4.25781H15.2344C15.498 4.25781 15.7227 4.02344 15.7227 3.76953C15.7227 3.51562 15.498 3.30078 15.2344 3.30078H13.7012C13.4473 3.30078 13.2227 3.51562 13.2227 3.76953C13.2227 4.02344 13.4473 4.25781 13.7012 4.25781ZM13.7012 6.21094H15.2344C15.498 6.21094 15.7227 5.98633 15.7227 5.72266C15.7227 5.46875 15.498 5.25391 15.2344 5.25391H13.7012C13.4473 5.25391 13.2227 5.46875 13.2227 5.72266C13.2227 5.98633 13.4473 6.21094 13.7012 6.21094ZM13.7012 8.16406H15.2344C15.498 8.16406 15.7227 7.93945 15.7227 7.68555C15.7227 7.43164 15.498 7.2168 15.2344 7.2168H13.7012C13.4473 7.2168 13.2227 7.43164 13.2227 7.68555C13.2227 7.93945 13.4473 8.16406 13.7012 8.16406Z" fill="currentColor" opacity="0.85"/>
        </svg>
      </button>
    </div>

    <div class="settings-section">
      <h3>Theme</h3>
      <div class="theme-picker">
        <button class="theme-btn" data-value="system">System</button>
        <button class="theme-btn" data-value="light">Light</button>
        <button class="theme-btn" data-value="dark">Dark</button>
      </div>
    </div>

    <div class="settings-section">
      <h3>Display</h3>
      <label class="toggle-row">
        <span class="toggle">
          <input type="checkbox" id="dividers-toggle">
          <span class="toggle-slider"></span>
        </span>
        Dividers between links
      </label>
      <label class="toggle-row" style="margin-top: 10px;">
        <span class="toggle">
          <input type="checkbox" id="hide-handles-toggle">
          <span class="toggle-slider"></span>
        </span>
        Hide column dividers
      </label>
      <label class="toggle-row" style="margin-top: 10px;">
        <span class="toggle">
          <input type="checkbox" id="show-hidden-toggle">
          <span class="toggle-slider"></span>
        </span>
        Show hidden items
      </label>
    </div>

    <div class="settings-section">
      <h3>Columns</h3>
      <div id="columns-config"></div>
      <button id="add-column" class="btn-add-col">+ Add column</button>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
